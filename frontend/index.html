<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律智能问答系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
  header { background: linear-gradient(135deg, #1a365d, #2c5282); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  header h1 { font-size: 18px; font-weight: 600; }
  header .badge { font-size: 12px; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: 12px; }
  #status { margin-left: auto; font-size: 12px; opacity: .85; }
  #status.ok::before { content: "● "; color: #68d391; }
  #status.err::before { content: "● "; color: #fc8181; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { max-width: 78%; padding: 12px 16px; border-radius: 12px; line-height: 1.7; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #2c5282; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #2d3748; border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .msg.bot .meta { display: block; margin-top: 8px; font-size: 11px; color: #a0aec0; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; align-self: flex-start; }
  .quick button { border: 1px solid #cbd5e0; background: #fff; border-radius: 16px; padding: 6px 14px; font-size: 13px; color: #4a5568; cursor: pointer; }
  .quick button:hover { border-color: #2c5282; color: #2c5282; }
  #inputbar { padding: 14px 24px; background: #fff; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; max-width: 860px; width: 100%; margin: 0 auto; }
  #input { flex: 1; border: 1px solid #cbd5e0; border-radius: 22px; padding: 11px 18px; font-size: 14.5px; outline: none; }
  #input:focus { border-color: #2c5282; }
  #send { background: #2c5282; color: #fff; border: none; border-radius: 22px; padding: 0 26px; font-size: 14.5px; cursor: pointer; }
  #send:disabled { background: #a0aec0; cursor: not-allowed; }
  .typing { color: #a0aec0; font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>⚖️ 法律智能问答系统</h1>
  <span class="badge">Bert 意图识别 + Neo4j 知识图谱</span>
  <span id="status">连接中…</span>
</header>

<div id="chat">
  <div class="msg bot">您好，我是法律智能问答助手。点击下方快捷问题或直接输入您想咨询的法律问题。</div>
  <div class="quick" id="quick">
    <button>什么是盗窃罪</button>
    <button>诈骗罪一般判几年</button>
    <button>刑法第266条的内容</button>
    <button>公司拖欠工资怎么办</button>
    <button>离婚时财产怎么分割</button>
    <button>取保候审需要满足什么条件</button>
  </div>
</div>

<div id="inputbar">
  <input id="input" placeholder="请输入您的法律问题，回车发送…" autocomplete="off">
  <button id="send">发送</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sessionId = localStorage.getItem('legal_qa_session') || null;

function addMsg(text, who, meta) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (meta) {
    const m = document.createElement('span');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send(text) {
  text = (text || input.value).trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  sendBtn.disabled = true;
  const typing = addMsg('正在思考…', 'bot', '');
  typing.classList.add('typing');
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: sessionId})
    });
    const data = await resp.json();
    typing.remove();
    if (data.session_id) {
      sessionId = data.session_id;
      localStorage.setItem('legal_qa_session', sessionId);
    }
    addMsg(data.answer || data.error || '服务异常', 'bot',
           data.intent ? `意图: ${data.intent} · 置信度: ${data.confidence}` : '');
  } catch (e) {
    typing.remove();
    addMsg('网络错误，请确认后端服务已启动。', 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = () => send();
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.getElementById('quick').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') send(e.target.textContent);
});

fetch('/api/health').then(r => r.json()).then(s => {
  const el = document.getElementById('status');
  if (s.neo4j === 'ok' && s.model === 'ok') { el.textContent = '服务正常'; el.className = 'ok'; }
  else { el.textContent = 'Neo4j/模型 未就绪'; el.className = 'err'; }
}).catch(() => {
  const el = document.getElementById('status');
  el.textContent = '服务离线'; el.className = 'err';
});
</script>
</body>
</html>
